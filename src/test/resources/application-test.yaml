spring:
  datasource:
    # 테스트는 개발 DB가 아닌 테스트 전용 DB에서 실행한다
    url: jdbc:mysql://localhost:3306/coffee_order_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  jpa:
    hibernate:
      # 테스트 컨텍스트가 시작될 때 엔티티 기준으로 테이블을 새로 만든다
      # 테스트 메서드 사이의 데이터 정리는 각 테스트의 @BeforeEach가 담당한다
      ddl-auto: create